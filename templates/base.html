<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="z2Lfb1zydJAd3tUl9C17Pb8yOzMevvp6UZ9j7lMttYI" />
<title>{% block title %}Free Link Exchange Directory{% endblock %}</title>
<meta name="description" content="{% block meta_desc %}Free link exchange directory for website owners. List your site, find link exchange partners in your niche, and build backlinks organically. No signup needed to browse.{% endblock %}">
<link rel="canonical" href="{% block canonical %}{{ site_url }}/link-exchange/{% endblock %}">
<meta name="robots" content="{% block robots %}index, follow{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Web Hospitality">
<meta property="og:image" content="https://www.thewebhospitality.com/wp-content/uploads/2020/02/android-icon-36x36-1.png">
<meta property="og:url" content="{% block og_url %}{{ site_url }}/link-exchange/{% endblock %}">
<meta property="og:title" content="{% block og_title %}Free Link Exchange Directory{% endblock %}">
<meta property="og:description" content="{% block og_desc %}Free link exchange directory — list your site, find partners by niche, build backlinks organically.{% endblock %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block tw_title %}Free Link Exchange Directory{% endblock %}">
<meta name="twitter:description" content="{% block tw_desc %}Free link exchange directory — list your site, find partners by niche, build backlinks organically.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>
{% include '_header.html' %}

<main class="main-wrapper">
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</main>

{% include '_footer.html' %}
<script>
  // ===== User account dropdown (header) =====
  document.addEventListener('DOMContentLoaded', function () {
    var menu = document.getElementById('userMenu');
    if (!menu) return;
    var btn = menu.querySelector('.user-menu-btn');
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      menu.classList.toggle('open');
    });
    document.addEventListener('click', function (e) {
      if (!menu.contains(e.target)) menu.classList.remove('open');
    });
  });

  // ===== FAQ accordion (click to expand/collapse) =====
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.faq-item .faq-question').forEach(function (q) {
      q.addEventListener('click', function () {
        var item = q.closest('.faq-item');
        var wasOpen = item.classList.contains('open');
        // close others (accordion style) - optional, remove for independent toggle
        item.closest('.faq-accordion').querySelectorAll('.faq-item.open').forEach(function (i) {
          i.classList.remove('open');
        });
        if (!wasOpen) item.classList.add('open');
      });
    });
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
